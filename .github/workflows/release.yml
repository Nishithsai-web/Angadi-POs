# Production build: a signed Android App Bundle (.aab) for Google Play.
#
# Run: push a tag like v1.0.0, or Actions → release → Run workflow (enter the version).
# Needs four repository secrets (Settings → Secrets and variables → Actions) — see docs/RELEASE.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional, to upload straight to the Play INTERNAL testing track (never production):
#   PLAY_SERVICE_ACCOUNT_JSON
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  aab:
    name: Signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version must look like 1.2.3, got '$v'"; exit 1; }
          echo "display=$v" >> "$GITHUB_OUTPUT"
          # Play needs a strictly increasing integer: the workflow run number never repeats.
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Release readiness (privacy policy, support number, versions, product IDs)
        run: python3 tools/release_check.py --version "${{ steps.v.outputs.display }}"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KP" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::missing repository secrets:$missing (see docs/RELEASE.md)"; exit 1; fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Tests must pass before anything is released
        run: dotnet test tests/Angadi.Tests/Angadi.Tests.csproj -c Release

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build signed AAB
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/angadi.keystore"
          set +e
          dotnet publish src/Angadi.Maui/Angadi.Maui.csproj -c Release -f net10.0-android \
            -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT -p:ContinuousIntegrationBuild=true \
            -p:ApplicationDisplayVersion=${{ steps.v.outputs.display }} -p:ApplicationVersion=${{ steps.v.outputs.code }} \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/angadi.keystore" \
            -p:AndroidSigningStorePass="$KSP" -p:AndroidSigningKeyAlias="$KA" -p:AndroidSigningKeyPass="$KP" \
            -o out 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/angadi.keystore"
          python3 tools/ci_report.py build.log "release build"
          exit $code

      - name: Collect
        run: |
          mkdir -p release
          cp out/*-Signed.aab "release/angadi-${{ steps.v.outputs.display }}-${{ steps.v.outputs.code }}.aab"
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: angadi-release-${{ steps.v.outputs.display }}
          path: release/*.aab
          if-no-files-found: error

      - name: Upload to Play internal testing (optional)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.angadi.pos
          releaseFiles: release/*.aab
          track: internal
          status: completed
