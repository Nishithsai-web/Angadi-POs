name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  core:
    name: Core build + tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch fonts (Noto Sans Telugu, OFL)
        run: tools/fetch_fonts.sh

      - name: Restore
        run: dotnet restore tests/Angadi.Tests/Angadi.Tests.csproj

      - name: Build (warnings are errors)
        run: |
          set +e
          dotnet build tests/Angadi.Tests/Angadi.Tests.csproj -c Release --no-restore \
            -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          python3 tools/ci_report.py build.log "core build"
          exit $code

      - name: Test with coverage
        shell: bash
        run: |
          set +e
          dotnet test tests/Angadi.Tests/Angadi.Tests.csproj -c Release --no-build --blame-crash --blame-hang-timeout 5m \
            --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" --results-directory TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[Angadi.Domain]*,[Angadi.Application]*,[Angadi.Infrastructure]*" \
            2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - name: Report failed tests
        if: always()
        run: python3 tools/ci_tests.py TestResults test.log

      - name: Coverage gate (NFR-10)
        run: python3 tools/coverage_gate.py TestResults

      - name: Voice rules and seed data check
        run: python3 tools/generate_seed.py --check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**

  android:
    name: Android app build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Fetch fonts (Noto Sans Telugu, OFL)
        run: tools/fetch_fonts.sh

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # EmbedAssembliesIntoApk: the APK carries its .NET code, so it installs and runs on any phone or emulator
      # (a plain Debug build expects Visual Studio's fast deployment and crashes when sideloaded).
      - name: Build Android (Debug, unsigned)
        run: |
          set +e
          dotnet build src/Angadi.Maui/Angadi.Maui.csproj -c Debug -f net10.0-android \
            -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT -p:ContinuousIntegrationBuild=true \
            -p:EmbedAssembliesIntoApk=true 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          python3 tools/ci_report.py build.log "android build"
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: angadi-debug-apk
          path: src/Angadi.Maui/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: warn

      # The build users get: Release (trimmed, optimised), as an APK signed with the debug key so the emulator can
      # install it. Same code path as the Play bundle in release.yml; only the package format and key differ.
      - name: Build Android (Release, as shipped)
        run: |
          set +e
          dotnet publish src/Angadi.Maui/Angadi.Maui.csproj -c Release -f net10.0-android \
            -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT -p:ContinuousIntegrationBuild=true \
            -p:AndroidPackageFormat=apk -o release-apk 2>&1 | tee release-build.log
          code=${PIPESTATUS[0]}
          python3 tools/ci_report.py release-build.log "android release build"
          exit $code

      - name: Google Play policy gate (target API, debuggable, sensitive permissions)
        run: |
          python3 tools/play_policy_check.py "$(ls src/Angadi.Maui/bin/Debug/net10.0-android/*-Signed.apk | head -1)"
          python3 tools/play_policy_check.py "$(ls release-apk/*-Signed.apk | head -1)" --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: angadi-release-apk
          path: release-apk/*-Signed.apk
          if-no-files-found: error

  e2e:
    name: Emulator end-to-end (${{ matrix.build }})
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]   # debug: every check incl. file-level ones; release: exactly what users install
    permissions:
      contents: write   # pushes the step screenshots to the ci-e2e branch for review
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: angadi-${{ matrix.build }}-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator (setup, cash, UPI, udhaar, barcode, reports, language)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: python3 tools/e2e_android.py "$(ls apk/*-Signed.apk | head -1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.build }}
          path: e2e-out/**

      - name: Publish screenshots for review
        if: always()
        run: |
          [ -d "$GITHUB_WORKSPACE/e2e-out" ] || { echo "no e2e output"; exit 0; }
          sha=$(git rev-parse --short HEAD)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work="$RUNNER_TEMP/ci-e2e"
          # A separate worktree: the main checkout (and e2e-out) stays untouched for the artifact upload.
          if git ls-remote --exit-code --heads origin ci-e2e >/dev/null 2>&1; then
            git fetch -q origin ci-e2e && git worktree add -q "$work" FETCH_HEAD && git -C "$work" checkout -q -B ci-e2e
          else
            git worktree add -q --orphan -b ci-e2e "$work"
          fi
          # One folder per branch and build, so parallel runs (debug/release, several branches) never overwrite each other.
          dest="$work/${GITHUB_REF_NAME//\//-}/${{ matrix.build }}"
          rm -rf "$dest" && mkdir -p "$dest"
          cp -r "$GITHUB_WORKSPACE/e2e-out/." "$dest/"
          echo "E2E run for $sha (${{ matrix.build }})" > "$dest/README.md"
          git -C "$work" add -A
          git -C "$work" commit -qm "E2E screenshots for $sha (${{ matrix.build }})" || { echo "nothing to publish"; exit 0; }
          for i in 1 2 3 4 5; do
            git -C "$work" push -q origin ci-e2e && exit 0
            git -C "$work" pull -q --rebase origin ci-e2e || true
          done
          echo "screenshots not published (branch busy)"
